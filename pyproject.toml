[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mr-lang"
version = "0.1.0"
description = "Agent orchestration framework built on LangChain/LangGraph/LangSmith"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "langsmith>=0.2",
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.3"]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
telegram = ["python-telegram-bot>=21"]
mcp = ["fastmcp>=2"]
postgres = ["psycopg[binary]>=3", "langgraph-checkpoint-postgres>=2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]
all = ["mr-lang[ollama,openai,anthropic,telegram,mcp,postgres,dev]"]

[project.scripts]
mr-lang = "mr_lang.cli.app:app"

[project.entry-points."mr_lang.tools"]
builtin = "mr_lang.tools.builtin"

[tool.hatch.build.targets.wheel]
packages = ["src/mr_lang"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
